# Builds the backend image and pushes it to the Azure registry.
# Azure for Students blocks ACR Tasks (az acr build), so the image is built
# here; deploy/azure/deploy.sh waits for this run and then updates the app.
name: Build image

on:
  push:
    branches: [beta, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Short commit
        id: meta
        run: echo "tag=$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ vars.ACR_LOGIN_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ vars.ACR_LOGIN_SERVER }}/nexo-backend:${{ steps.meta.outputs.tag }}
            ${{ vars.ACR_LOGIN_SERVER }}/nexo-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
